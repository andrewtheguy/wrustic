[package]
name = "wrustic"
version = "0.0.54"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
# Same crate rustic_core uses for restic's AEAD (AES-256-CTR + Poly1305-AES);
# needed to write/read restic-compatible lock files (see docs/locking.md).
aes256ctr_poly1305aes = "0.2"
anyhow = "1"
base64 = "0.22"
bytes = "1"
dirs = "6"
gethostname = "1"
hmac = "0.13"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jiff = { version = "0.2", features = ["serde"] }
opendal = { version = "0.57.0", default-features = false, features = ["blocking", "layers-retry", "reqwest-rustls-tls", "services-s3"] }
rand = "0.10.1"
# Direct HTTP access to the rest-server `locks/` endpoints (rustic_backend's
# REST backend is FileType-addressed and cannot reach them). Blocking client;
# same features rustic_backend already compiles reqwest with.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
ratatui = "0.30.0"
# No `opendal` feature: it has no per-service knob and compiles every opendal
# service crate (~150 packages). S3 repo data goes through wrustic's own
# rustic_core backend over `opendal-service-s3` instead (src/s3_backend.rs).
rustic_backend = { version = "0.6.2", default-features = false, features = ["rest"] }
rustic_core = { version = "0.12.0", default-features = false }
scrypt = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
# Constant-time byte comparison for the NTLMv2 proof check. A hand-written
# `diff |= a ^ b` loop is one the optimiser is free to turn into an early exit;
# `ct_eq` carries the barriers that stop it.
subtle = "2"
tokio ={ version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros"] }
toml = "1"
tui-input = { version = "0.15", default-features = false, features = ["crossterm"] }
url = "2"
zstd = "0.13"
keyring-core = { version = "1", optional = true }
md-5 = "0.11"
md4 = "0.11"
rc4 = "0.2"

[target.'cfg(unix)'.dependencies]
# uid/gid for restic-compatible lock files, kill(pid, 0) staleness probes, and
# the SIGHUP disposition dance (see docs/locking.md). All Unix-only concepts;
# the Windows build has its own equivalents via windows-sys.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# OpenProcess-based liveness probe for same-host lock staleness — the Windows
# counterpart of kill(pid, 0), mirroring restic's os.FindProcess use.
#
# IpHelper/WinSock are for the SMB tun transport (src/smb/tun.rs): assigning the
# adapter address through CreateUnicastIpAddressEntry rather than shelling out
# to `netsh`, which is what the wintun crate's own setters do.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }
# Serving SMB on the standard port 445 is impossible through the Windows socket
# layer: srvnet.sys holds an exclusive system-wide reservation on it, and no
# interface, binding change or service stop frees it (only unloading srvnet
# itself does, which takes host file sharing down with it). Wintun gives us an
# L3 device whose packets we terminate in our own TCP stack, so port 445 is
# claimed in a stack Windows does not arbitrate — the same reason a VM guest or
# a WireGuard peer can hold 445 without disturbing the host. See docs/smb-tun.md.
#
# Off by default: it embeds a 427 KB signed driver in the binary and only earns
# its keep if you actually want UNC paths. Enable with `--features smb-tun`.
wintun = { version = "0.5", optional = true }
smoltcp = { version = "0.13", default-features = false, optional = true, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "socket-tcp",
    # Not optional in practice: without it smoltcp silently drops echo requests
    # (the `_ => None` arm in process_icmpv4), so `ping 169.254.255.1` fails while
    # the share works perfectly. Pinging the address is the first thing anyone
    # does when a mount misbehaves, and a share that cannot be pinged looks
    # broken when it is not. It is in smoltcp's own default feature set; turning
    # defaults off to keep the build small dropped it by accident.
    "auto-icmp-echo-reply",
] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1", optional = true }

[features]
# Serve the snapshot share on port 445 through a user-space TCP stack on a
# Wintun adapter, so it mounts as a plain UNC path. Windows-only — the crates
# are declared under `cfg(windows)`, and the code is additionally gated on the
# target, so enabling this on Linux or macOS is a no-op rather than an error.
smb-tun = ["dep:wintun", "dep:smoltcp"]
keychain = [
    "dep:keyring-core",
    "dep:apple-native-keyring-store",
    "dep:dbus-secret-service-keyring-store",
    "dep:windows-native-keyring-store",
]

# restic's key file is scrypt-derived, so every repository open pays a full
# KDF. Unoptimised, that costs ~10 s per open and made each test that touches
# a repository run for minutes. Optimising only the KDF crates keeps wrustic's
# own code unoptimised and fully debuggable.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3
