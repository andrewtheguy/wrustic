[package]
name = "wrustic"
version = "0.0.17"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
age = ">=0.11.3, <0.12"
anyhow = "1.0.102"
askama = "0.16.0"
base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10"
dirs = "5"
hkdf = "0.13"
hmac = "0.13"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jiff = "0.2"
pbkdf2 = { version = "0.13.0", features = ["hmac"] }
rand = "0.10.1"
ratatui = "0.30.0"
rustic_backend = { version = "0.6.1", default-features = false, features = ["rest", "opendal"] }
rustic_core = { version = "0.11.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "macros"] }
toml = "0.8"
tui-input = { version = "0.14", default-features = false, features = ["crossterm"] }
url = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
