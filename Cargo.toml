[package]
name = "wrustic"
version = "0.0.66"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
# Same crate rustic_core uses for restic's AEAD (AES-256-CTR + Poly1305-AES);
# needed to write/read restic-compatible lock files (see docs/locking.md).
aes256ctr_poly1305aes = "0.2"
anyhow = "1"
base64 = "0.22"
bytes = "1"
dirs = "6"
gethostname = "1"
hmac = "0.13"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jiff = { version = "0.2", features = ["serde"] }
opendal = { version = "0.57.0", default-features = false, features = ["blocking", "layers-retry", "reqwest-rustls-tls", "services-s3"] }
rand = "0.10.1"
# The read-only SMB 2.1 server the snapshot share runs on, shared with the
# smbanything project. Default features off: the `tun` transport (wintun +
# a userspace TCP stack) is compiled in only by wrustic's `smb-tun` feature.
smbanything_core = { git = "https://github.com/andrewtheguy/smbanything.git", tag = "v0.0.5", default-features = false }
# Direct HTTP access to the rest-server `locks/` endpoints (rustic_backend's
# REST backend is FileType-addressed and cannot reach them). Blocking client;
# same features rustic_backend already compiles reqwest with.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
ratatui = "0.30.0"
# Hidden-input passphrase prompt for `wrustic env` when neither the env var
# nor the keychain has the passphrase. Talks to the controlling terminal
# directly (/dev/tty, CONIN$), so the prompt works while stdout is captured.
rpassword = "7"
# No `opendal` feature: it has no per-service knob and compiles every opendal
# service crate (~150 packages). S3 repo data goes through wrustic's own
# rustic_core backend over `opendal-service-s3` instead (src/s3_backend.rs).
rustic_backend = { version = "0.6.2", default-features = false, features = ["rest"] }
rustic_core = { version = "0.12.0", default-features = false }
scrypt = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tokio ={ version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros"] }
toml = "1"
tui-input = { version = "0.15", default-features = false, features = ["crossterm"] }
url = "2"
zstd = "0.13"
keyring-core = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
# uid/gid for restic-compatible lock files, kill(pid, 0) staleness probes, and
# the SIGHUP disposition dance (see docs/locking.md). All Unix-only concepts;
# the Windows build has its own equivalents via windows-sys.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# OpenProcess-based liveness probe for same-host lock staleness — the Windows
# counterpart of kill(pid, 0), mirroring restic's os.FindProcess use.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1", optional = true }

[features]
# Serve the snapshot share on port 445 through a user-space TCP stack on a
# Wintun adapter (smbanything_core's tun transport), so it mounts as a plain
# UNC path. wrustic only wires it up on Windows — srvnet.sys owning 445 is not
# a problem any other platform has — so while the transport itself compiles
# everywhere, enabling this elsewhere changes nothing.
smb-tun = ["smbanything_core/tun"]
keychain = [
    "dep:keyring-core",
    "dep:apple-native-keyring-store",
    "dep:dbus-secret-service-keyring-store",
    "dep:windows-native-keyring-store",
]

# The developer harnesses behind `wrustic dev <name>`: a config fixture
# writer and SMB servers that stay up long enough to mount from another
# machine. They need wrustic's internals but assert nothing, so they are
# neither tests nor part of any shipped binary — no release build in
# release.yml enables this.
dev-harness = []

# restic's key file is scrypt-derived, so every repository open pays a full
# KDF. Unoptimised, that costs ~10 s per open and made each test that touches
# a repository run for minutes. Optimising only the KDF crates keeps wrustic's
# own code unoptimised and fully debuggable.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3
