name: Windows CI

# Build-and-test only — no release steps. Registered on main; dispatch it
# against a branch to CI that branch:
#   gh workflow run windows-ci.yml --ref <branch>
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

      # The live tests (#[ignore]) need a restic binary / S3 server / OS
      # credential store and stay out of CI; everything else runs.
      - name: Test
        run: cargo test --all-features

      - name: Release build (keychain enabled, like the shipped Windows binary)
        run: cargo build --release --features keychain
