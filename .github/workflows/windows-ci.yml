name: Windows CI

# Build-and-test only — no release steps.
#
# Triggered like Unix CI, on demand, against any branch:
#   gh workflow run windows-ci.yml --ref <branch>
#
# Advisory, not a gate: `main` carries no branch protection, so no check here is
# a *required* status check and a red one never stops a merge. It is there to be
# read, and making it block would be a settings change on the repository rather
# than an edit to this file.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

      # The live tests (#[ignore]) need a restic binary / S3 server / OS
      # credential store and stay out of CI; everything else runs.
      - name: Test
        run: cargo test --all-features

      # Must stay in step with the windows-amd64 row of release.yml, or CI stops
      # building what users actually download.
      - name: Release build (same features as the shipped Windows binary)
        run: cargo build --release --features keychain,smb-tun
