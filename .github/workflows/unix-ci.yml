name: Unix CI

# Linux and macOS, on demand — the platforms Windows CI cannot speak for.
# Dispatch it against any branch:
#   gh workflow run unix-ci.yml --ref <branch>
#
# This exists for one class of bug: name handling that is right on one platform
# and wrong on another. `src/smb/name.rs` decodes the quoting restic applies to
# every filename it stores, and that decoding was once gated behind
# `cfg!(windows)`. The gate was correct for the accessor it was written against
# and wrong for the raw stored name it ended up guarding, so a share hosted on
# Linux or macOS served the *quoted* name — and any file whose name needed
# quoting was listed mangled and could not be opened. Every Windows test passed
# throughout.
#
# Two tests fail on Unix if it comes back:
#   smb::name::tests::conversion_is_not_platform_conditional
#   smb::backing::tests::node_info_decodes_the_name_the_repository_stores

# Advisory, not a gate: `main` carries no branch protection, so nothing here is
# a *required* status check and a red one never stops a merge.
on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      # Both platforms report: one failing must not hide the other's result,
      # which is the whole point of running them.
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # libdbus: `--all-features` turns on `keychain`, whose Linux backend is
      # the D-Bus secret service and needs it to build. The shipped Linux binary
      # is built without the feature (see release.yml, and docs/keychain.md for
      # why), but compiling it here is what keeps it from rotting.
      #
      # smbclient: six tests drive a real client through the handshake, a
      # directory walk and a read, and *skip themselves* where it is not
      # installed. Without this line they would report as passing while doing
      # nothing, which is worse than not having them.
      - name: Install libdbus and smbclient (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config smbclient

      - name: Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

      # The live tests (#[ignore]) need a restic binary / S3 server / OS
      # credential store and stay out of CI; everything else runs.
      - name: Test
        run: cargo test --all-features
