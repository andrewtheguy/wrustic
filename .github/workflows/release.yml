name: Release (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.new }}
      is_prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [ -z "$version" ]; then
            echo "::error::Could not parse version from Cargo.toml"
            exit 1
          fi
          tag="v$version"
          echo "new=$tag" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Abort if tag already exists
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.new }}" | grep -q .; then
            echo "::error::Tag ${{ steps.version.outputs.new }} already exists on remote"
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${{ steps.version.outputs.new }}" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx true; then
            echo "Deleting stale draft release ${{ steps.version.outputs.new }}"
            gh release delete "${{ steps.version.outputs.new }}" --yes
          fi
          gh release create "${{ steps.version.outputs.new }}" \
            --draft \
            --target "${{ github.sha }}" \
            --title "Release ${{ steps.version.outputs.new }}" \
            --generate-notes \
            ${{ steps.version.outputs.prerelease == 'true' && '--prerelease' || '' }}

  build:
    needs: setup
    strategy:
      matrix:
        include:
          # Linux ships without `keychain`: the D-Bus secret-service store needs
          # libdbus at build time and a running keyring daemon at runtime, which
          # a headless host has neither of. See docs/keychain.md.
          #
          # restic_build/restic_sha256 pin the restic each platform's package
          # bundles (checksums from the SHA256SUMS restic publishes for the
          # release). Windows pins its zip in the installer step instead.
          # rpm_arch marks the platforms that also get an .rpm.
          - runner: ubuntu-latest
            label: linux-amd64
            features: ""
            restic_build: linux_amd64
            restic_sha256: f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c
            rpm_arch: x86_64
          - runner: ubuntu-24.04-arm
            label: linux-arm64
            features: ""
            restic_build: linux_arm64
            restic_sha256: a5f64aaab53d51e311fa3829124c5b703f2d14cf187d8640b6be3b2b49376465
            rpm_arch: aarch64
          - runner: macos-latest
            label: macos-arm64
            features: "--features keychain"
            restic_build: darwin_arm64
            restic_sha256: 7be0a144ccc377880f294204aa271d76e4b79554b42a751151d425ce6ebac143
          # Windows Credential Manager is part of the OS — no build or runtime
          # dependency to install, so `keychain` ships enabled.
          #
          # `smb-tun` ships too, otherwise `--smb-tun` exists only for people who
          # build from source. Windows releases as an installer
          # (wrustic-windows-amd64-setup.exe) that lays down wrustic.exe, the
          # signed wintun driver (wintun-amd64.dll), and a pinned restic.exe in
          # one directory; see docs/smb-tun.md and ci/windows/installer.iss.
          - runner: windows-latest
            label: windows-amd64
            features: "--features keychain,smb-tun"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release ${{ matrix.features }}

      # The vendored wintun driver is a committed binary the installer ships to
      # be loaded as code, and its hash is pinned in WINTUN_DLL_SHA256. Nothing
      # else in the release path would notice the two drifting apart, so assert
      # it here rather than ship a driver the constant no longer describes. A
      # cargo test filter that matches nothing still exits 0, so a renamed or
      # gated-out test would silently stop guarding anything — require the test
      # to be discovered before trusting its run.
      - name: Verify the vendored driver matches its pinned hash
        if: matrix.label == 'windows-amd64'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release ${{ matrix.features }} vendored_driver_matches_its_pinned_hash -- --list \
            | grep -q vendored_driver_matches_its_pinned_hash \
            || { echo "::error::vendored_driver_matches_its_pinned_hash was not discovered; the driver hash is unverified"; exit 1; }
          cargo test --release ${{ matrix.features }} vendored_driver_matches_its_pinned_hash

      # The installer payload: wrustic.exe, the vendored wintun driver, and a
      # pinned restic (verified against the SHA256SUMS restic publishes for the
      # release before anything is extracted). A packaged wrustic runs this
      # bundled restic and no other (installed into the restic\ subdirectory,
      # off the PATH entry the installer adds), so the pin here *is* the
      # restic every Windows install prunes with.
      - name: Build Windows installer
        if: matrix.label == 'windows-amd64'
        shell: bash
        env:
          RESTIC_VERSION: "0.19.1"
          RESTIC_ZIP_SHA256: "da948ad707ed690426473aaba2046cd61f8f90f6f0e7dab6be0d5796531de67d"
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          mkdir -p stage dist
          curl -fsSL -o restic.zip \
            "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_windows_amd64.zip"
          echo "${RESTIC_ZIP_SHA256}  restic.zip" | sha256sum -c -
          unzip -j restic.zip -d stage
          mv "stage/restic_${RESTIC_VERSION}_windows_amd64.exe" stage/restic.exe
          cp target/release/wrustic.exe stage/
          cp vendor/wintun/wintun-amd64.dll stage/
          # Absolute Windows-style paths: relative Source/Output paths in an
          # .iss resolve against the script's directory, not this shell's CWD.
          # MSYS2_ARG_CONV_EXCL disables Git Bash's argument path-mangling,
          # which otherwise rewrites the /D switches into filesystem paths
          # (ISCC then reads them as extra script filenames); with conversion
          # off, the .iss path is handed over in Windows form too.
          MSYS2_ARG_CONV_EXCL="*" "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "/DAppVersion=${version}" \
            "/DStageDir=$(cygpath -w "$PWD/stage")" \
            "/DOutDir=$(cygpath -w "$PWD/dist")" \
            "$(cygpath -w "$PWD/ci/windows/installer.iss")"

      # The unix counterpart of the Windows installer: a .deb (Linux) / .pkg
      # (macOS) that installs /opt/wrustic/wrustic, the pinned restic at
      # /opt/wrustic/restic/restic (same subdirectory contract as Windows —
      # the only restic a packaged wrustic will run, and it stays off PATH
      # itself), and a wrustic symlink in the standard bin directory. Program
      # files only: config, state, and the restic cache stay per-user at
      # runtime. The staged pkgroot/ is also what the .rpm step packages.
      - name: Build the Linux .deb / macOS .pkg
        if: matrix.restic_build != ''
        shell: bash
        env:
          RESTIC_VERSION: "0.19.1"
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          curl -fsSL -o restic.bz2 \
            "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_${{ matrix.restic_build }}.bz2"
          # shasum, not sha256sum: present on both the Ubuntu and macOS runners.
          echo "${{ matrix.restic_sha256 }}  restic.bz2" | shasum -a 256 -c -
          bunzip2 restic.bz2
          mkdir -p pkgroot/opt/wrustic/restic dist
          install -m 0755 target/release/wrustic pkgroot/opt/wrustic/wrustic
          install -m 0755 restic pkgroot/opt/wrustic/restic/restic
          if [ "${{ runner.os }}" = "macOS" ]; then
            # /usr/local/bin is on the default PATH (/etc/paths) even on
            # arm64. The pkg is unsigned/un-notarized: a browser download
            # gets quarantined and refused by Gatekeeper, but fetching with
            # curl and running `sudo installer -pkg` works — see README.
            #
            # The symlink is made by postinstall rather than shipped in the
            # payload on purpose: a payload entry makes the installer assert
            # the payload's ownership and mode on /usr, /usr/local and
            # /usr/local/bin, which resets a Homebrew-owned prefix to
            # root:wheel. mkdir -p leaves an existing directory's owner and
            # mode alone. So the pkg's payload is /opt/wrustic and nothing
            # else.
            mkdir -p scripts
            cat > scripts/postinstall <<'POSTINSTALL'
          #!/bin/sh
          set -eu
          mkdir -p /usr/local/bin
          ln -sfn /opt/wrustic/wrustic /usr/local/bin/wrustic
          POSTINSTALL
            chmod 0755 scripts/postinstall
            pkgbuild --root pkgroot \
              --scripts scripts \
              --identifier com.andrewtheguy.wrustic \
              --version "${version}" \
              --install-location / \
              "dist/wrustic-${{ matrix.label }}.pkg"
          else
            arch="${{ matrix.label }}"
            arch="${arch#linux-}"
            mkdir -p pkgroot/DEBIAN pkgroot/usr/bin
            ln -s /opt/wrustic/wrustic pkgroot/usr/bin/wrustic
            {
              echo "Package: wrustic"
              echo "Version: ${version}"
              echo "Architecture: ${arch}"
              echo "Maintainer: andrewtheguy <andrewchen5678@gmail.com>"
              echo "Section: utils"
              echo "Priority: optional"
              echo "Homepage: https://github.com/andrewtheguy/wrustic"
              echo "Description: Terminal UI for restic-format backup repositories"
              echo " Installs under /opt/wrustic with a pinned restic for the prune flow."
            } > pkgroot/DEBIAN/control
            dpkg-deb --build --root-owner-group pkgroot "dist/wrustic-${{ matrix.label }}.deb"
          fi

      # The Fedora/RHEL/openSUSE counterpart of the .deb: same layout, same
      # bundled restic, packaged straight out of the pkgroot/ the previous
      # step staged. rpmbuild comes from Ubuntu's `rpm` package; nothing is
      # compiled here, so the spec has no %build and rpm's compile-oriented
      # post-install processing is switched off.
      - name: Build the Linux .rpm
        if: matrix.rpm_arch != ''
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          top="$PWD/rpmbuild"
          mkdir -p "$top"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS} dist
          cat > "$top/SPECS/wrustic.spec" <<SPEC
          %global debug_package %{nil}
          %global __os_install_post %{nil}
          Name:           wrustic
          Version:        ${version}
          Release:        1
          Summary:        Terminal UI for restic-format backup repositories
          License:        Proprietary
          URL:            https://github.com/andrewtheguy/wrustic
          BuildArch:      ${{ matrix.rpm_arch }}
          # rpm's dependency scan runs on a Debian host here, so it would name
          # Debian's libraries; the payload is one Rust binary against the base
          # system libraries plus a static Go restic, so declare nothing.
          AutoReqProv:    no

          %description
          Installs under /opt/wrustic with a pinned restic for the prune flow.
          Config, state, and the restic cache stay per-user at runtime.

          %install
          mkdir -p %{buildroot}/opt/wrustic/restic %{buildroot}/usr/bin
          install -m 0755 $PWD/pkgroot/opt/wrustic/wrustic %{buildroot}/opt/wrustic/wrustic
          install -m 0755 $PWD/pkgroot/opt/wrustic/restic/restic %{buildroot}/opt/wrustic/restic/restic
          ln -s /opt/wrustic/wrustic %{buildroot}/usr/bin/wrustic

          %files
          %dir /opt/wrustic
          %dir /opt/wrustic/restic
          /opt/wrustic/wrustic
          /opt/wrustic/restic/restic
          /usr/bin/wrustic
          SPEC
          rpmbuild -bb --define "_topdir $top" "$top/SPECS/wrustic.spec"
          mv "$top/RPMS/${{ matrix.rpm_arch }}"/wrustic-*.rpm "dist/wrustic-${{ matrix.label }}.rpm"

      # bash is present on the Windows runners too, so one step works
      # everywhere instead of a pwsh variant. Packages only: a bare binary
      # would ship without the restic subdirectory next to it, and a packaged
      # wrustic runs no other restic, so it would be dead on arrival.
      - name: Prepare release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          mv dist/* out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrustic-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  create-release:
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wrustic-*
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Upload artifacts to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ needs.setup.outputs.release_tag }}" artifacts/* --clobber

      - name: Publish release (remove draft, creates the tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ needs.setup.outputs.release_tag }}" --draft=false
