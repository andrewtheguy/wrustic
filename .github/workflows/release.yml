name: Release (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.new }}
      is_prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [ -z "$version" ]; then
            echo "::error::Could not parse version from Cargo.toml"
            exit 1
          fi
          tag="v$version"
          echo "new=$tag" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Abort if tag already exists
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.new }}" | grep -q .; then
            echo "::error::Tag ${{ steps.version.outputs.new }} already exists on remote"
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${{ steps.version.outputs.new }}" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx true; then
            echo "Deleting stale draft release ${{ steps.version.outputs.new }}"
            gh release delete "${{ steps.version.outputs.new }}" --yes
          fi
          gh release create "${{ steps.version.outputs.new }}" \
            --draft \
            --target "${{ github.sha }}" \
            --title "Release ${{ steps.version.outputs.new }}" \
            --generate-notes \
            ${{ steps.version.outputs.prerelease == 'true' && '--prerelease' || '' }}

  build:
    needs: setup
    strategy:
      matrix:
        include:
          # Linux ships without `keychain`: the D-Bus secret-service store needs
          # libdbus at build time and a running keyring daemon at runtime, which
          # a headless host has neither of. See docs/keychain.md.
          - runner: ubuntu-latest
            label: linux-amd64
            features: ""
            ext: ""
          - runner: ubuntu-24.04-arm
            label: linux-arm64
            features: ""
            ext: ""
          - runner: macos-latest
            label: macos-arm64
            features: "--features keychain"
            ext: ""
          # Windows Credential Manager is part of the OS — no build or runtime
          # dependency to install, so `keychain` ships enabled.
          #
          # `smb-tun` ships too, otherwise `--smb-tun` exists only for people who
          # build from source: install.ps1 delivers this binary and nothing else,
          # and the wintun driver rides inside it rather than being a separate
          # asset. Costs ~564 KiB of embedded, signed driver (measured: 14,159,872
          # -> 14,737,408 bytes); see docs/smb-tun.md.
          - runner: windows-latest
            label: windows-amd64
            features: "--features keychain,smb-tun"
            ext: ".exe"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release ${{ matrix.features }}

      # bash is present on the Windows runners too, so one rename works
      # everywhere instead of a pwsh variant.
      - name: Rename binary
        shell: bash
        run: mv target/release/wrustic${{ matrix.ext }} target/release/wrustic-${{ matrix.label }}${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrustic-${{ matrix.label }}
          path: target/release/wrustic-${{ matrix.label }}${{ matrix.ext }}
          if-no-files-found: error

  create-release:
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wrustic-*
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Upload artifacts to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ needs.setup.outputs.release_tag }}" artifacts/* --clobber

      - name: Publish release (remove draft, creates the tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ needs.setup.outputs.release_tag }}" --draft=false
