# Per-repo values for the shared ../devtools scripts (see
# ../devtools/templates/devtools.conf.sample for every key).
REPO_NAME=wrustic
CI_ENV_PREFIX=WRUSTIC
UNIXCI_DEFAULT_HOST=workstation-wsl
# Extra doctor probes, spliced into the remote doctor shell line (single-quoted
# so nothing expands locally when this file is sourced).
UNIXCI_DOCTOR_CMD='if [ "$(uname -s)" = Linux ]; then pkg-config --exists dbus-1 && echo "libdbus: present" || echo "libdbus: MISSING (apt-get install libdbus-1-dev pkg-config)"; command -v smbclient >/dev/null && echo "smbclient: present" || echo "smbclient: missing (six tests will skip themselves)"; fi'
WINCI_STACK=rust
